# Stack do Empurrão (pode ser colada no Portainer em Stacks → Add stack).
services:
  empurrao:
    build: .
    image: empurrao:latest
    container_name: empurrao
    restart: unless-stopped
    environment:
      - PORT=3042
    ports:
      # Porta do host : porta do container. Troque a da esquerda se a 3042 já estiver em uso.
      - "3042:3042"
    networks:
      # Rede compartilhada com o cloudflared: o túnel aponta para http://empurrao:3042.
      - apps-network

networks:
  apps-network:
    external: true
